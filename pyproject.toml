[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "railway-crowd-monitoring"
version = "1.0.0"
description = "AI-Based Intelligent Crowd Monitoring and Anomaly Detection System for Railway Stations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "supervision>=0.25.0",
    "opencv-python>=4.10.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pytest>=8.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "scipy>=1.12.0",
    "shapely>=2.0.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0"
]
